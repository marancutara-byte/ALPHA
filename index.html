<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ALPHA</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <div id="app">

        <header>

            <h1>ALPHA</h1>

            <p>
                Inteligencia Artificial
            </p>

        </header>


        <main id="chat">

            <div class="message alpha-message">

                Hola. Soy <strong>ALPHA</strong>.

                <br><br>

                Mi sistema de inteligencia artificial
                está siendo construido.

            </div>

        </main>


        <footer>

            <input
                id="messageInput"
                type="text"
                placeholder="Escribe un mensaje..."
                autocomplete="off"
            >

            <button id="sendButton">
                Enviar
            </button>

        </footer>

    </div>


    <script src="js/app.js"></script>

</body>

</html>
