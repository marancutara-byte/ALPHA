<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ALPHA - Inteligencia Artificial</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <div id="app">

        <header>

            <div class="alpha-logo">
                A
            </div>

            <div>
                <h1>ALPHA</h1>

                <p>
                    Inteligencia Artificial
                </p>
            </div>

        </header>


        <main id="chat">

            <div class="message alpha-message">

                <strong>ALPHA:</strong>

                <br><br>

                Hola. Soy ALPHA.

                <br>

                Mi sistema de inteligencia artificial
                está siendo construido.

            </div>

        </main>


        <footer>

            <input
                id="messageInput"
                type="text"
                placeholder="Escribe un mensaje..."
                autocomplete="off"
            >

            <button id="sendButton">
                Enviar
            </button>

        </footer>

    </div>


    <script src="js/app.js"></script>

</body>

</html>
